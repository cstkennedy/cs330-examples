[package]
name = "tictactoe"
version = "0.1.0"
edition = "2024"

[lib]
name="tictactoe"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
eyre = "0.6.12"
hamcrest2 = "*"
itertools = "0.13.0"
thiserror = "2.0.3"
log = "0.4.33"
pyo3-log = "0.13.4"

[dependencies.pyo3]
version = "0.29.0"
features = ["extension-module", "experimental-inspect"]

[dev-dependencies]
rstest = "0.21.0"
